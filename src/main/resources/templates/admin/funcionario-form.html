
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar funcionário | Bloom Coffee</title>
    <link rel="stylesheet" th:href="@{/css/funcionarios_form.css}">
</head>

<body>
<header>
    <h1>Bloom Coffee</h1>
    <p>Cadastro de funcionário</p>
</header>

<main>
    <section class="formulario">
        <h2>Novo funcionário</h2>
        <p>Preencha os dados para criar a conta de acesso à equipe.</p>

        <div th:if="${erro}" class="erro" th:text="${erro}"></div>

        <form th:action="@{/admin/funcionarios/salvar}"
              th:object="${funcionario}"
              method="post">

            <div class="campo">
                <label for="nome">Nome completo *</label>
                <input type="text"
                       id="nome"
                       th:field="*{nome}"
                       maxlength="100"
                       autocomplete="name"
                       required>
            </div>

            <div class="campo">
                <label for="cpf">CPF *</label>
                <input type="text"
                       id="cpf"
                       th:field="*{cpf}"
                       maxlength="14"
                       placeholder="000.000.000-00"
                       required>
                <p class="ajuda">
                    Informe os 11 dígitos do CPF, com ou sem pontuação.
                </p>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel"
                       id="telefone"
                       th:field="*{telefone}"
                       maxlength="20"
                       autocomplete="tel"
                       placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label for="email">E-mail de acesso *</label>
                <input type="email"
                       id="email"
                       th:field="*{usuario.email}"
                       maxlength="100"
                       autocomplete="email"
                       required>
            </div>

            <div class="campo">
                <label for="senha">Senha inicial *</label>
                <input type="password"
                       id="senha"
                       th:field="*{usuario.senha}"
                       minlength="8"
                       maxlength="72"
                       autocomplete="new-password"
                       required>
                <p class="ajuda">
                    A senha deve ter pelo menos 8 caracteres.
                </p>
            </div>

            <div class="botoes">
                <button type="submit" class="botao">
                    Cadastrar funcionário
                </button>

                <a th:href="@{/admin/funcionarios}"
                   class="botao secundario">
                    Cancelar
                </a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
