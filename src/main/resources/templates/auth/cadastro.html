<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Bloom Coffee</title>

    <meta name="description"
          content="Crie sua conta na Bloom Coffee e faça seus pedidos.">

    <link rel="stylesheet" th:href="@{/css/loginCliente.css}">
    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>

<body>

<main class="form-panel">
    <section class="form-box">

        <div class="logo">Bloom Coffee ☕</div>

        <h1 style="text-align: center; font-size: 25px;">
            Crie sua conta
        </h1>

        <p class="subtitle">
            Cadastre-se para conhecer nosso cardápio e fazer seus pedidos.
        </p>

        <p class="required-note">
            * Campos obrigatórios.
        </p>

        <form th:action="@{/cadastro}"
              th:object="${cliente}"
              method="post">

            <!-- Nome -->
            <div class="field">
                <label for="nome">Nome completo *</label>
                <input id="nome"
                       type="text"
                       th:field="*{nome}"
                       maxlength="100"
                       autocomplete="name"
                       placeholder="Digite seu nome completo"
                       required>
                <small class="field-error"
                       th:if="${#fields.hasErrors('nome')}"
                       th:errors="*{nome}"></small>
            </div>

            <!-- CPF: campo obrigatório no banco -->
            <div class="field">
                <label for="cpf">CPF *</label>
                <input id="cpf"
                       type="text"
                       th:field="*{cpf}"
                       maxlength="11"
                       minlength="11"
                       inputmode="numeric"
                       placeholder="Somente os 11 números"
                       required>
                <small class="field-error"
                       th:if="${#fields.hasErrors('cpf')}"
                       th:errors="*{cpf}"></small>
            </div>

            <!-- Telefone -->
            <div class="field">
                <label for="telefone">Telefone</label>
                <input id="telefone"
                       type="tel"
                       th:field="*{telefone}"
                       maxlength="20"
                       autocomplete="tel"
                       placeholder="(11) 99999-9999">
                <small class="field-error"
                       th:if="${#fields.hasErrors('telefone')}"
                       th:errors="*{telefone}"></small>
            </div>

            <!-- E-mail -->
            <div class="field">
                <label for="email">E-mail *</label>
                <input id="email"
                       type="email"
                       th:field="*{email}"
                       maxlength="100"
                       autocomplete="email"
                       placeholder="seuemail@exemplo.com"
                       required>
                <small class="field-error"
                       th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"></small>
            </div>

            <!-- Senha -->
            <div class="field">
                <label for="senha">Senha *</label>
                <input id="senha"
                       type="password"
                       th:field="*{senha}"
                       minlength="8"
                       maxlength="100"
                       autocomplete="new-password"
                       placeholder="Crie uma senha"
                       required>
                <small class="hint">
                    A senha deve ter pelo menos 8 caracteres.
                </small>
                <small class="field-error"
                       th:if="${#fields.hasErrors('senha')}"
                       th:errors="*{senha}"></small>
            </div>

            <!-- Data de nascimento -->
            <div class="field">
                <label for="dataNascimento">Data de nascimento</label>
                <input id="dataNascimento"
                       type="date"
                       th:field="*{dataNascimento}"
                       autocomplete="bday">
                <small class="field-error"
                       th:if="${#fields.hasErrors('dataNascimento')}"
                       th:errors="*{dataNascimento}"></small>
            </div>

            <!-- Endereço -->
            <div class="field">
                <label for="endereco">Endereço</label>
                <input id="endereco"
                       type="text"
                       th:field="*{endereco}"
                       maxlength="150"
                       autocomplete="street-address"
                       placeholder="Rua, número e complemento">
                <small class="field-error"
                       th:if="${#fields.hasErrors('endereco')}"
                       th:errors="*{endereco}"></small>
            </div>

            <!-- Bairro -->
            <div class="field">
                <label for="bairro">Bairro</label>
                <input id="bairro"
                       type="text"
                       th:field="*{bairro}"
                       maxlength="100"
                       placeholder="Digite seu bairro">
                <small class="field-error"
                       th:if="${#fields.hasErrors('bairro')}"
                       th:errors="*{bairro}"></small>
            </div>

            <!-- Cidade -->
            <div class="field">
                <label for="cidade">Cidade</label>
                <input id="cidade"
                       type="text"
                       th:field="*{cidade}"
                       maxlength="100"
                       autocomplete="address-level2"
                       placeholder="Digite sua cidade">
                <small class="field-error"
                       th:if="${#fields.hasErrors('cidade')}"
                       th:errors="*{cidade}"></small>
            </div>

            <!-- Mensagem de erro -->
            <p class="mensagem-erro"
               th:if="${erro}"
               th:text="${erro}"
               role="alert"></p>

            <!-- Botão -->
            <button type="submit" class="btn-primary-custom">
                Criar minha conta
            </button>

        </form>

        <p class="login-link">
            Já possui uma conta?
            <a th:href="@{/login}">Entrar</a>
        </p>

        <p class="login-link">
            <a th:href="@{/}">Voltar para a página inicial</a>
        </p>

    </section>
</main>

</body>
</html>
