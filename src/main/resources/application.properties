spring.application.name=cafeteriabloomcoffee

# Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_bloomcoffee?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Senai@499
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate
spring.jpa.generate-ddl=trueg
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true

# Thymeleaf
spring.thymeleaf.cache=false

# Upload de arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB

# Porta do servidor
server.port=80